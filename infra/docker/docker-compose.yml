services:

  mongodb:
    image: mongo:8
    container_name: interviewpilot-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/server.Dockerfile
    container_name: interviewpilot-backend
    restart: unless-stopped
    ports:
      - "5001:5000"

    env_file:
      - ../../server/.env

    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/interviewpilot2
      FFMPEG_PATH: /usr/bin/ffmpeg

    depends_on:
      - mongodb

volumes:
  mongodb_data:
